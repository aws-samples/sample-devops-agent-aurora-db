AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hosts the Aurora PostgreSQL MCP server as a Streamable HTTP endpoint
  via Lambda + API Gateway HTTP API v2, suitable for registration as
  an AWS DevOps Agent Capability Provider.

Parameters:
  Environment:
    Type: String
    Default: demo
    Description: Naming prefix for all resources

  MasterDBCredentialsSecretArn:
    Type: String
    Description: >-
      ARN of the Secrets Manager secret holding the Aurora master credentials,
      created and generated by the cluster stack (its
      MasterDBCredentialsSecretArn output). The master password is never passed
      to this stack directly.

  AllowWriteQueries:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Allow write queries (INSERT, UPDATE, DELETE, etc.)

  ClusterIdentifier:
    Type: String
    Default: aurora-postgres-cluster-1
    Description: >-
      Aurora cluster identifier the MCP server is allowed to query. Used to scope
      the RDS Data API IAM permissions to a single cluster ARN instead of all
      clusters in the account/region.

  AppDbUsername:
    Type: String
    Default: mcp_app
    AllowedPattern: '^[a-z_][a-z0-9_]*$'
    Description: >-
      Name of the least-privilege PostgreSQL role the MCP server authenticates as
      (created by scripts/setup-readonly-role.sh). Must be a valid PostgreSQL
      identifier. This role should be granted only the read (or narrowly scoped)
      privileges the MCP server needs, not master/superuser.

  SecretsKmsKeyId:
    Type: String
    Default: ''
    Description: >-
      Optional KMS key ID/ARN used to encrypt the Secrets Manager secrets. Leave
      empty to have this template create a dedicated customer-managed KMS CMK.
      Using a CMK (instead of the default aws/secretsmanager key) gives you
      control over key policies, rotation, and audit, per AWS security best
      practices.

  ApiThrottleRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Steady-state request rate limit (requests/second) applied to the MCP API
      stage. Bounds abuse and brute-force attempts against the public endpoint.

  ApiThrottleBurstLimit:
    Type: Number
    Default: 40
    MinValue: 1
    Description: >-
      Burst request limit for the MCP API stage. Should be >= the rate limit.

  WafRateLimitPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: >-
      WAF rate-based rule threshold: max requests allowed from a single source IP
      over a 5-minute window before that IP is blocked. Protects the public
      endpoint from volumetric abuse and credential brute-forcing.

  StatementTimeoutMs:
    Type: Number
    Default: 30000
    MinValue: 0
    Description: >-
      PostgreSQL statement_timeout (milliseconds) applied to queries run through
      the MCP server. 0 disables the timeout. Guards against expensive/runaway
      queries via the public endpoint.

  EnableApiKeyRotation:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Enable automatic rotation of the MCP API key via Secrets Manager. The
      authorizer accepts both the current and previous key values, so rotation
      does not cause an outage: after each rotation you have until the next
      rotation to update the DevOps Agent registration with the new key.

  ApiKeyRotationDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: >-
      How often (in days) to automatically rotate the MCP API key when rotation
      is enabled.

Conditions:
  CreateSecretsKmsKey: !Equals [!Ref SecretsKmsKeyId, '']
  RotateApiKey: !Equals [!Ref EnableApiKeyRotation, 'true']

Resources:

  SecretsKmsKey:
    Type: AWS::KMS::Key
    Condition: CreateSecretsKmsKey
    Properties:
      Description: !Sub 'CMK for ${Environment} postgres-mcp-server Secrets Manager secrets'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSecretsManagerUse
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateSecretsKmsKey
    Properties:
      AliasName: !Sub 'alias/${Environment}-postgres-mcp-secrets'
      TargetKeyId: !Ref SecretsKmsKey

  # The Aurora master credentials secret is created and owned by the cluster
  # stack (generated password). This stack consumes it by ARN via the
  # MasterDBCredentialsSecretArn parameter — it does not create or receive the
  # master password.

  # Least-privilege application credentials the MCP server uses for the RDS
  # Data API. The password is generated here; the matching PostgreSQL role
  # (with read-only or scoped grants) must be created by an operator via the
  # bootstrap SQL in scripts/setup-readonly-role.sh, which reads the username
  # and password from this secret. This keeps the master 'postgres' credentials
  # out of the public-endpoint code path.
  AppDbCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${Environment}/postgres-mcp-server/app-db-credentials'
      Description: Least-privilege Aurora role used by the MCP server via RDS Data API
      KmsKeyId: !If [CreateSecretsKmsKey, !Ref SecretsKmsKey, !Ref SecretsKmsKeyId]
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${AppDbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\ '"
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  McpApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${Environment}/postgres-mcp-server/api-key'
      Description: API key for DevOps Agent to authenticate with the PostgreSQL MCP server
      KmsKeyId: !If [CreateSecretsKmsKey, !Ref SecretsKmsKey, !Ref SecretsKmsKeyId]
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: api_key
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\<>&'%?:;|{}[]()=+#^~` "
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  McpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-postgres-mcp-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PostgresMcpPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RDSDataAPI
                Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                # Scoped to the single Aurora cluster this MCP server serves.
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${ClusterIdentifier}'
              - Sid: RDSDescribe
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusterEndpoints
                # These are List/Read actions that AWS does NOT support with
                # resource-level ARNs — IAM requires Resource: '*' for them (see
                # "Actions, resources, and condition keys for Amazon RDS"). This
                # only allows *reading metadata* (identifier, status, endpoint).
                # It does NOT widen data access: rds-data above is scoped to the
                # single cluster ARN, and do_run_query() authenticates with the
                # least-privilege app secret, so SQL cannot be run against any
                # other cluster regardless of what Describe can enumerate.
                Resource: '*'
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                # Scoped to only the least-privilege app credentials this function
                # uses. The master DB secret is intentionally NOT granted here.
                Resource:
                  - !Ref AppDbCredentialsSecret
              - Sid: KmsDecryptSecrets
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                # Scoped to the specific CMK protecting these secrets.
                Resource: !If
                  - CreateSecretsKmsKey
                  - !GetAtt SecretsKmsKey.Arn
                  - !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${SecretsKmsKeyId}'
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-postgres-mcp-authorizer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadApiKeySecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref McpApiKeySecret
              - Sid: KmsDecryptApiKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                # Scoped to the specific CMK protecting these secrets.
                Resource: !If
                  - CreateSecretsKmsKey
                  - !GetAtt SecretsKmsKey.Arn
                  - !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${SecretsKmsKeyId}'
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-postgres-mcp-server'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt McpLambdaRole.Arn
      Timeout: 300
      MemorySize: 1024
      Architectures:
        - arm64
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ALLOW_WRITE_QUERIES: !Ref AllowWriteQueries
          # The MCP server authenticates as the least-privilege app role, not the
          # Aurora master user. The Data API resolves credentials from this secret.
          DB_SECRET_ARN: !Ref AppDbCredentialsSecret
          STATEMENT_TIMEOUT_MS: !Ref StatementTimeoutMs
      Code:
        ZipFile: |
          import json, os, time, logging, boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          rds = boto3.client('rds')
          rds_data = boto3.client('rds-data')

          ALLOW_WRITE = os.environ.get('ALLOW_WRITE_QUERIES', 'false').lower() == 'true'
          DB_SECRET_ARN = os.environ.get('DB_SECRET_ARN', '')
          try:
              STATEMENT_TIMEOUT_MS = int(os.environ.get('STATEMENT_TIMEOUT_MS', '30000'))
          except ValueError:
              STATEMENT_TIMEOUT_MS = 30000

          TOOLS = [
              {'name': 'list_clusters', 'description': 'List all Aurora PostgreSQL and RDS PostgreSQL clusters.', 'inputSchema': {'type': 'object', 'properties': {}}},
              {'name': 'list_databases', 'description': 'List all databases in a cluster.', 'inputSchema': {'type': 'object', 'properties': {'cluster_identifier': {'type': 'string', 'description': 'Aurora cluster identifier'}, 'database': {'type': 'string', 'description': 'Database to connect to'}}, 'required': ['cluster_identifier', 'database']}},
              {'name': 'list_schemas', 'description': 'List all schemas in a database.', 'inputSchema': {'type': 'object', 'properties': {'cluster_identifier': {'type': 'string'}, 'database': {'type': 'string'}}, 'required': ['cluster_identifier', 'database']}},
              {'name': 'list_tables', 'description': 'List all tables in a schema.', 'inputSchema': {'type': 'object', 'properties': {'cluster_identifier': {'type': 'string'}, 'database': {'type': 'string'}, 'schema_name': {'type': 'string', 'description': 'Schema name (default: public)'}}, 'required': ['cluster_identifier', 'database']}},
              {'name': 'describe_table', 'description': 'Describe table structure (columns, types, constraints).', 'inputSchema': {'type': 'object', 'properties': {'cluster_identifier': {'type': 'string'}, 'database': {'type': 'string'}, 'schema_name': {'type': 'string', 'description': 'Schema name (default: public)'}, 'table_name': {'type': 'string', 'description': 'Table name'}}, 'required': ['cluster_identifier', 'database', 'table_name']}},
              {'name': 'execute_query', 'description': 'Execute a SQL query against Aurora PostgreSQL via the Data API.', 'inputSchema': {'type': 'object', 'properties': {'cluster_identifier': {'type': 'string'}, 'database': {'type': 'string'}, 'sql': {'type': 'string', 'description': 'SQL query to execute'}}, 'required': ['cluster_identifier', 'database', 'sql']}}
          ]

          def lambda_handler(event, context):
              http_method = event.get('requestContext', {}).get('http', {}).get('method', 'POST')
              if http_method == 'GET':
                  return {'statusCode': 200, 'headers': {'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache'}, 'body': ''}
              body = event.get('body', '{}') or '{}'
              if event.get('isBase64Encoded'):
                  import base64
                  body = base64.b64decode(body).decode('utf-8')
              response = handle_jsonrpc(json.loads(body))
              return {'statusCode': 200, 'headers': {'Content-Type': 'application/json'}, 'body': json.dumps(response)}

          def handle_jsonrpc(req):
              method = req.get('method', '')
              req_id = req.get('id')
              params = req.get('params', {})
              if method == 'ping':
                  return {'jsonrpc': '2.0', 'id': req_id, 'result': {}}
              if method == 'initialize':
                  return {'jsonrpc': '2.0', 'id': req_id, 'result': {'protocolVersion': '2024-11-05', 'capabilities': {'tools': {}}, 'serverInfo': {'name': 'postgres-mcp', 'version': '2.0.0'}}}
              if method == 'tools/list':
                  return {'jsonrpc': '2.0', 'id': req_id, 'result': {'tools': TOOLS}}
              if method == 'tools/call':
                  tool_name = params.get('name', '')
                  args = params.get('arguments', {})
                  result = dispatch(tool_name, args)
                  return {'jsonrpc': '2.0', 'id': req_id, 'result': result}
              return {'jsonrpc': '2.0', 'id': req_id, 'error': {'code': -32601, 'message': 'Method not found'}}

          def dispatch(tool_name, args):
              try:
                  if tool_name == 'list_clusters':
                      return do_list_clusters()
                  if tool_name == 'list_databases':
                      return do_run_query(args, "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY datname")
                  if tool_name == 'list_schemas':
                      return do_run_query(args, "SELECT schema_name FROM information_schema.schemata WHERE schema_name NOT IN ('pg_catalog', 'information_schema') ORDER BY schema_name")
                  if tool_name == 'list_tables':
                      schema = args.get('schema_name', 'public')
                      return do_run_query(args, "SELECT table_name FROM information_schema.tables WHERE table_schema = :schema_name AND table_type = 'BASE TABLE' ORDER BY table_name", [{'name': 'schema_name', 'value': {'stringValue': schema}}])
                  if tool_name == 'describe_table':
                      schema = args.get('schema_name', 'public')
                      table = args.get('table_name', '')
                      return do_run_query(args, "SELECT column_name, data_type, character_maximum_length, is_nullable, column_default FROM information_schema.columns WHERE table_schema = :schema_name AND table_name = :table_name ORDER BY ordinal_position", [{'name': 'schema_name', 'value': {'stringValue': schema}}, {'name': 'table_name', 'value': {'stringValue': table}}])
                  if tool_name == 'execute_query':
                      sql = args.get('sql', 'SELECT 1')
                      if not ALLOW_WRITE and not is_read_only_sql(sql):
                          return error_response('Write queries are disabled. Set ALLOW_WRITE_QUERIES=true to enable.')
                      # When writes are disabled, run inside a read-only transaction so
                      # the database itself rejects any write, closing gaps in the
                      # application-layer check (functions, DO blocks, COPY, etc.).
                      return do_run_query(args, sql, read_only=not ALLOW_WRITE)
                  return error_response(f'Unknown tool: {tool_name}')
              except Exception as e:
                  # Log the full error server-side for the operator, but return a
                  # generic message to the caller. Raw DB errors can echo table
                  # names, column values, and other schema detail back over the
                  # public endpoint, which aids enumeration.
                  logger.exception(json.dumps({'event': 'tool_error', 'tool': tool_name}))
                  return error_response('The request could not be completed. See server logs for details.')

          def do_list_clusters():
              results = []
              paginator = rds.get_paginator('describe_db_clusters')
              for page in paginator.paginate():
                  for c in page.get('DBClusters', []):
                      if 'postgresql' in c.get('Engine', ''):
                          endpoint = c.get('Endpoint', 'N/A')
                          status = c.get('Status', 'unknown')
                          data_api = 'Yes' if c.get('HttpEndpointEnabled') else 'No'
                          results.append(f"{c['DBClusterIdentifier']} ({status}) | Endpoint: {endpoint} | Data API: {data_api}")
              text = '\n'.join(results) or 'No PostgreSQL clusters found'
              return success_response(text)

          # First-token allowlist for read-only statements. This is a defense-in-depth
          # complement to the read-only transaction enforced at the DB layer, not the
          # sole control. It rejects obvious writes early and cheaply.
          READ_ONLY_STARTS = ('SELECT', 'WITH', 'SHOW', 'EXPLAIN', 'TABLE', 'VALUES')

          def is_read_only_sql(sql):
              # Strip leading SQL comments/whitespace, then check the first keyword.
              s = (sql or '').lstrip()
              # Drop leading line/block comments so they can't hide the real verb.
              changed = True
              while changed:
                  changed = False
                  if s.startswith('--'):
                      nl = s.find('\n')
                      s = '' if nl == -1 else s[nl + 1:].lstrip()
                      changed = True
                  elif s.startswith('/*'):
                      end = s.find('*/')
                      s = '' if end == -1 else s[end + 2:].lstrip()
                      changed = True
              first = s[:16].upper()
              # Reject multiple statements (a naive but useful guard); the read-only
              # transaction is the authoritative backstop.
              if ';' in s.rstrip().rstrip(';'):
                  return False
              return first.startswith(READ_ONLY_STARTS)

          def do_run_query(args, sql, parameters=None, read_only=False):
              cluster_id = args.get('cluster_identifier', '')
              database = args.get('database', '')
              # Audit log: tool usage without leaking secrets. Log a bounded prefix of
              # the SQL only; never log the API key or full request headers.
              logger.info(json.dumps({
                  'event': 'execute_sql',
                  'cluster_identifier': cluster_id,
                  'database': database,
                  'read_only': read_only,
                  'sql_prefix': (sql or '')[:200],
              }))
              resp = rds.describe_db_clusters(DBClusterIdentifier=cluster_id)
              cluster_arn = resp['DBClusters'][0]['DBClusterArn']
              # Run every query inside a transaction so we can apply a
              # statement_timeout (and, when writes are disabled, enforce
              # read-only at the database layer).
              tx = rds_data.begin_transaction(resourceArn=cluster_arn, secretArn=DB_SECRET_ARN, database=database)
              tx_id = tx['transactionId']
              try:
                  if read_only:
                      # The database itself rejects any write regardless of how the
                      # SQL is constructed (functions, DO blocks, COPY, etc.).
                      rds_data.execute_statement(resourceArn=cluster_arn, secretArn=DB_SECRET_ARN,
                                                 database=database, transactionId=tx_id,
                                                 sql='SET TRANSACTION READ ONLY')
                  if STATEMENT_TIMEOUT_MS and STATEMENT_TIMEOUT_MS > 0:
                      # Bound query cost/runtime. PostgreSQL SET does not accept bind
                      # parameters, so inline the integer. STATEMENT_TIMEOUT_MS is
                      # cast to int from env at startup, so it cannot carry injection.
                      rds_data.execute_statement(resourceArn=cluster_arn, secretArn=DB_SECRET_ARN,
                                                 database=database, transactionId=tx_id,
                                                 sql='SET LOCAL statement_timeout = %d' % STATEMENT_TIMEOUT_MS)
                  stmt_args = {'resourceArn': cluster_arn, 'secretArn': DB_SECRET_ARN,
                               'database': database, 'transactionId': tx_id, 'sql': sql}
                  if parameters:
                      stmt_args['parameters'] = parameters
                  result = rds_data.execute_statement(**stmt_args)
                  rds_data.commit_transaction(resourceArn=cluster_arn, secretArn=DB_SECRET_ARN, transactionId=tx_id)
              except Exception:
                  try:
                      rds_data.rollback_transaction(resourceArn=cluster_arn, secretArn=DB_SECRET_ARN, transactionId=tx_id)
                  except Exception:
                      pass
                  raise
              if 'records' not in result or not result['records']:
                  return success_response('Query executed successfully (no results returned)')
              records = result['records']
              column_metadata = result.get('columnMetadata', [])
              if not column_metadata:
                  return success_response(json.dumps(records, indent=2))
              headers = [col['label'] for col in column_metadata]
              rows = []
              for record in records:
                  row = []
                  for field in record:
                      value = list(field.values())[0] if field else ''
                      row.append(str(value))
                  rows.append(row)
              lines = [' | '.join(headers)]
              lines.append('-' * len(lines[0]))
              lines += [' | '.join(row) for row in rows]
              return success_response('\n'.join(lines))

          def success_response(text):
              return {'content': [{'type': 'text', 'text': text}]}

          def error_response(error_msg):
              return {'content': [{'type': 'text', 'text': f'ERROR: {error_msg}'}], 'isError': True}
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-postgres-mcp-authorizer'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 10
      MemorySize: 128
      Architectures:
        - arm64
      Environment:
        Variables:
          SECRET_ARN: !Ref McpApiKeySecret
      Code:
        ZipFile: |
          import json, os, time, hmac, boto3
          sm = boto3.client('secretsmanager')
          SECRET_ARN = os.environ['SECRET_ARN']
          # Cache the accepted keys with a short TTL so key rotation takes effect
          # quickly without waiting for a Lambda cold start.
          CACHE_TTL_SECONDS = 300
          _cached = {'values': None, 'expires': 0}

          def _get_stage(stage):
              # Return the api_key for a given version stage, or None if absent.
              try:
                  resp = sm.get_secret_value(SecretId=SECRET_ARN, VersionStage=stage)
              except Exception:
                  return None
              try:
                  return json.loads(resp['SecretString'])['api_key']
              except Exception:
                  return None

          def get_accepted_keys():
              now = time.time()
              if _cached['values'] is not None and now < _cached['expires']:
                  return _cached['values']
              # Accept both the current and the previous key during rotation so a
              # newly rotated secret does not lock out clients still holding the
              # old value. AWSPREVIOUS may not exist before the first rotation.
              keys = []
              for stage in ('AWSCURRENT', 'AWSPREVIOUS'):
                  k = _get_stage(stage)
                  if k:
                      keys.append(k)
              _cached['values'] = keys
              _cached['expires'] = now + CACHE_TTL_SECONDS
              return keys

          def extract_token(raw):
              # Accept both a bare key and a "Bearer <key>" scheme; trim whitespace.
              raw = (raw or '').strip()
              if raw.lower().startswith('bearer '):
                  raw = raw[7:].strip()
              return raw

          def lambda_handler(event, context):
              headers = event.get('headers') or {}
              # Never log the Authorization header or the token value.
              token = extract_token(headers.get('authorization', ''))
              valid = False
              if token:
                  # Constant-time comparison against every accepted key. Compare all
                  # candidates (no short-circuit) to keep timing uniform.
                  for expected in get_accepted_keys():
                      if hmac.compare_digest(token, expected):
                          valid = True
              return {'isAuthorized': valid, 'context': {'authorized': str(valid)}}
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  # --- Automatic API key rotation ------------------------------------------
  # Secrets Manager drives a standard 4-step rotation. The api-key secret has
  # no external "user store" to update (the key is validated by the authorizer),
  # so setSecret/testSecret are effectively no-ops; the authorizer accepts both
  # AWSCURRENT and AWSPREVIOUS so finishSecret never causes an outage.
  RotationLambdaRole:
    Type: AWS::IAM::Role
    Condition: RotateApiKey
    Properties:
      RoleName: !Sub '${Environment}-postgres-mcp-rotation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RotateApiKeySecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsManagerRotation
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecretVersionStage
                  - secretsmanager:GetRandomPassword
                # Scoped to only the API key secret.
                Resource: !Ref McpApiKeySecret
              - Sid: KmsForRotation
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !If
                  - CreateSecretsKmsKey
                  - !GetAtt SecretsKmsKey.Arn
                  - !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${SecretsKmsKeyId}'
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  ApiKeyRotationFunction:
    Type: AWS::Lambda::Function
    Condition: RotateApiKey
    Properties:
      FunctionName: !Sub '${Environment}-postgres-mcp-key-rotation'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt RotationLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import json, logging, boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          sm = boto3.client('secretsmanager')

          # Characters excluded from generated keys must match the set used when
          # the secret was first created, to keep the key shape consistent.
          EXCLUDE = "\"@/\\<>&'%?:;|{}[]()=+#^~` "

          def lambda_handler(event, context):
              arn = event['SecretId']
              token = event['ClientRequestToken']
              step = event['Step']
              meta = sm.describe_secret(SecretId=arn)
              if not meta.get('RotationEnabled', False):
                  logger.info('Rotation not enabled for %s; continuing anyway', arn)
              versions = meta.get('VersionIdsToStages', {})
              if token not in versions:
                  raise ValueError('Version %s not found for secret %s' % (token, arn))
              stages = versions[token]
              if 'AWSCURRENT' in stages:
                  logger.info('Version %s already AWSCURRENT; nothing to do', token)
                  return
              if 'AWSPENDING' not in stages:
                  raise ValueError('Version %s not AWSPENDING for secret %s' % (token, arn))

              if step == 'createSecret':
                  create_secret(arn, token)
              elif step == 'setSecret':
                  # No external system stores this key; nothing to set.
                  logger.info('setSecret: no-op for API key secret')
              elif step == 'testSecret':
                  test_secret(arn, token)
              elif step == 'finishSecret':
                  finish_secret(arn, token)
              else:
                  raise ValueError('Unknown step: %s' % step)

          def create_secret(arn, token):
              # If a pending value already exists, keep it (idempotency).
              try:
                  sm.get_secret_value(SecretId=arn, VersionId=token, VersionStage='AWSPENDING')
                  logger.info('AWSPENDING already has a value; skipping generation')
                  return
              except sm.exceptions.ResourceNotFoundException:
                  pass
              new_key = sm.get_random_password(PasswordLength=32, ExcludeCharacters=EXCLUDE,
                                                ExcludePunctuation=False, IncludeSpace=False)['RandomPassword']
              sm.put_secret_value(SecretId=arn, ClientRequestToken=token,
                                  SecretString=json.dumps({'api_key': new_key}),
                                  VersionStages=['AWSPENDING'])
              logger.info('createSecret: staged a new api_key as AWSPENDING')

          def test_secret(arn, token):
              # Validate the pending value is well-formed JSON with a non-empty key.
              resp = sm.get_secret_value(SecretId=arn, VersionId=token, VersionStage='AWSPENDING')
              key = json.loads(resp['SecretString']).get('api_key', '')
              if not key or len(key) < 16:
                  raise ValueError('Pending api_key failed validation')
              logger.info('testSecret: pending api_key looks valid')

          def finish_secret(arn, token):
              meta = sm.describe_secret(SecretId=arn)
              current = None
              for version, stages in meta.get('VersionIdsToStages', {}).items():
                  if 'AWSCURRENT' in stages:
                      current = version
                      break
              if current == token:
                  logger.info('finishSecret: %s already current', token)
                  return
              sm.update_secret_version_stage(SecretId=arn, VersionStage='AWSCURRENT',
                                             MoveToVersionId=token, RemoveFromVersionId=current)
              logger.info('finishSecret: promoted %s to AWSCURRENT (previous kept as AWSPREVIOUS)', token)
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  ApiKeyRotationPermission:
    Type: AWS::Lambda::Permission
    Condition: RotateApiKey
    Properties:
      FunctionName: !Ref ApiKeyRotationFunction
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ApiKeyRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: RotateApiKey
    DependsOn: ApiKeyRotationPermission
    Properties:
      SecretId: !Ref McpApiKeySecret
      RotationLambdaARN: !GetAtt ApiKeyRotationFunction.Arn
      RotationRules:
        AutomaticallyAfterDays: !Ref ApiKeyRotationDays

  McpHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${Environment}-postgres-mcp-api'
      ProtocolType: HTTP
      Description: Streamable HTTP endpoint for PostgreSQL MCP server

  McpLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref McpHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt McpLambdaFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  McpAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref McpHttpApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      Name: ApiKeyAuthorizer
      IdentitySource:
        - '$request.header.Authorization'

  McpApiPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref McpHttpApi
      RouteKey: 'POST /mcp'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref McpAuthorizer
      Target: !Sub 'integrations/${McpLambdaIntegration}'

  McpApiGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref McpHttpApi
      RouteKey: 'GET /mcp'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref McpAuthorizer
      Target: !Sub 'integrations/${McpLambdaIntegration}'

  McpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref McpHttpApi
      StageName: '$default'
      AutoDeploy: true
      # Throttle the public endpoint to bound abuse and brute-force attempts.
      # Tune these to expected DevOps Agent call volume.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit

  McpLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpHttpApi}/*/*'

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpHttpApi}/*'

  # WAF in front of the public MCP endpoint: a rate-based rule blocks any single
  # source IP that exceeds the configured request volume over a 5-minute window,
  # plus AWS-managed rule sets for common web exploits and known-bad inputs.
  McpWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${Environment}-postgres-mcp-web-acl'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${Environment}-postgres-mcp-web-acl'
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp
        - Name: AWSCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSCommonRuleSet
        - Name: AWSKnownBadInputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSKnownBadInputs
      Tags:
        - Key: Project
          Value: postgres-mcp-server

  # NOTE: WAFv2 cannot be associated directly with an API Gateway HTTP API (v2)
  # stage. AWS WAF only supports REST APIs (arn:.../restapis/...), CloudFront,
  # ALB, AppSync, Cognito, App Runner, Amplify, and Verified Access -- not the
  # /apis/ (HTTP API v2) resource this stack uses. Attempting the association
  # fails with "The ARN isn't valid". The McpWebAcl above is therefore left
  # unassociated. To actually enforce it, front this HTTP API with a CloudFront
  # distribution (Scope: CLOUDFRONT) and associate the WebACL with that
  # distribution instead. The public endpoint is still protected by API Gateway
  # stage throttling (ApiThrottleRateLimit/BurstLimit) and the Lambda authorizer.

Outputs:
  McpEndpointUrl:
    Description: "Paste this URL into DevOps Agent Capability Providers (auth header: Authorization)"
    Value: !Sub 'https://${McpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp'
    Export:
      Name: !Sub '${AWS::StackName}-McpEndpointUrl'

  ApiKeySecretArn:
    Description: "Retrieve the API key value from this secret (field api_key)"
    Value: !Ref McpApiKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-ApiKeySecretArn'

  DBCredentialsSecretArn:
    Description: "Secret holding the Aurora master DB credentials (generated by the cluster stack; used by operator scripts, NOT the MCP endpoint)"
    Value: !Ref MasterDBCredentialsSecretArn
    Export:
      Name: !Sub '${AWS::StackName}-DBCredentialsSecretArn'

  AppDbCredentialsSecretArn:
    Description: "Secret holding the least-privilege app role the MCP server uses. Run scripts/setup-readonly-role.sh after deploy to create the matching PostgreSQL role."
    Value: !Ref AppDbCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-AppDbCredentialsSecretArn'

  LambdaFunctionName:
    Value: !Ref McpLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  WriteQueriesEnabled:
    Description: Whether write queries (INSERT, UPDATE, DELETE) are allowed
    Value: !Ref AllowWriteQueries
